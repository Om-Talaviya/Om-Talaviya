<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230">
  <!-- Window Container -->
  <rect width="900" height="230" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Terminal Title Bar -->
  <path d="M 0 10 Q 0 0 10 0 L 890 0 Q 900 0 900 10 L 900 36 L 0 36 Z" fill="#f6f8fa"/>
  <line x1="0" y1="36" x2="900" y2="36" stroke="#d0d7de" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5.5" fill="#27c93f"/>

  <!-- Title -->
  <text x="450.0" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#656d76" text-anchor="middle">om@agentic-core: ~</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 66)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13">
    <!-- Command Line -->
    <text x="0" y="0" font-weight="700" fill="#0284c7">om@agentic-core:~$</text>
    <text x="160" y="0" font-weight="500" fill="#1f2328">whoami --verbose --systems</text>

    <!-- Line 1: Identity -->
    <text x="0" y="28" font-weight="700" fill="#1a7f37">NAME</text>
    <text x="100" y="28" fill="#656d76">::</text>
    <text x="130" y="28" font-weight="600" fill="#1f2328">Om Talaviya</text>
    <text x="240" y="28" fill="#656d76">[AI &amp; Systems Engineer &#8226; Agentic Platforms]</text>

    <!-- Line 2: Focus -->
    <text x="0" y="52" font-weight="700" fill="#8250df">FOCUS</text>
    <text x="100" y="52" fill="#656d76">::</text>
    <text x="130" y="52" fill="#1f2328">Agentic AI Orchestration &#8226; Multimodal RAG &#8226; Model Gateways</text>

    <!-- Line 3: Active Systems -->
    <text x="0" y="76" font-weight="700" fill="#9a6700">ACTIVE</text>
    <text x="100" y="76" fill="#656d76">::</text>
    <text x="130" y="76" fill="#0284c7">Universal-Coding-Agent</text>
    <text x="325" y="76" fill="#656d76">[Supervisor] &amp;</text>
    <text x="460" y="76" fill="#0284c7">Research-Platform</text>
    <text x="625" y="76" fill="#656d76">[Multimodal]</text>

    <!-- Line 4: Core Stack -->
    <text x="0" y="100" font-weight="700" fill="#1a7f37">STACK</text>
    <text x="100" y="100" fill="#656d76">::</text>
    <text x="130" y="100" fill="#1f2328">Python &#8226; TypeScript &#8226; FastAPI &#8226; Next.js &#8226; Vector DBs &#8226; Docker</text>

    <!-- Line 5: Approach -->
    <text x="0" y="124" font-weight="700" fill="#0284c7">STATUS</text>
    <text x="100" y="124" fill="#656d76">::</text>
    <text x="130" y="124" fill="#656d76">Architecting deterministic, autonomous AI software systems</text>
  </g>
</svg>