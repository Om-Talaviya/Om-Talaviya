<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240">
  <!-- Container -->
  <rect width="900" height="240" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(24, 30)">
    <circle cx="6" cy="-4" r="5" fill="#0284c7"/>
    <text x="20" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1f2328" letter-spacing="0.5">AGENTIC ARCHITECTURE &bull; PIPELINE TOPOLOGY</text>
    <text x="852" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#0284c7" text-anchor="end">Deterministic v2.4</text>
  </g>
  <line x1="24" y1="42" x2="876" y2="42" stroke="#d0d7de" stroke-width="1"/>

  <!-- Nodes Layout -->
  
  <!-- Node 1: Input -->
  <g transform="translate(36, 68)">
    <rect width="180" height="136" rx="10" fill="#f6f8fa" stroke="#eaeef2" stroke-width="1.5"/>
    <rect width="180" height="28" rx="10" fill="rgba(2, 132, 199, 0.08)"/>
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0284c7">01. INGESTION</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Multimodal Inputs</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Context &amp; AST Code</text>
    <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Vectorized Embeddings</text>
    <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Live Telemetry Feed</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(224, 130)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="24,-4 32,0 24,4" fill="#0284c7"/>
  </g>

  <!-- Node 2: Router -->
  <g transform="translate(264, 68)">
    <rect width="180" height="136" rx="10" fill="#f6f8fa" stroke="#0284c7" stroke-width="2"/>
    <rect width="180" height="28" rx="10" fill="rgba(2, 132, 199, 0.12)"/>
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0284c7">02. ORCHESTRATION</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Model Gateway</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Dynamic Routing Logic</text>
    <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Latency/Cost Optimizer</text>
    <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Fallback Consensus</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(452, 130)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="24,-4 32,0 24,4" fill="#0284c7"/>
  </g>

  <!-- Node 3: Hybrid Retrieval -->
  <g transform="translate(488, 68)">
    <rect width="180" height="136" rx="10" fill="#f6f8fa" stroke="#eaeef2" stroke-width="1.5"/>
    <rect width="180" height="28" rx="10" fill="rgba(2, 132, 199, 0.08)"/>
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0284c7">03. KNOWLEDGE</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Hybrid RAG Engine</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Dense + Sparse Vectors</text>
    <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Reciprocal Rank Fusion</text>
    <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Graph Memory Cache</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(676, 130)">
    <line x1="0" y1="0" x2="24" y2="0" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="24,-4 32,0 24,4" fill="#0284c7"/>
  </g>

  <!-- Node 4: Autonomous Execution -->
  <g transform="translate(712, 68)">
    <rect width="152" height="136" rx="10" fill="#f6f8fa" stroke="#eaeef2" stroke-width="1.5"/>
    <rect width="152" height="28" rx="10" fill="rgba(2, 132, 199, 0.08)"/>
    <text x="14" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0284c7">04. EXECUTION</text>
    <text x="14" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1f2328">Agentic Actions</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Sandbox Verification</text>
    <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Automated PR &amp; Git</text>
    <text x="14" y="114" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#656d76">&bull; Deterministic Tests</text>
  </g>

</svg>